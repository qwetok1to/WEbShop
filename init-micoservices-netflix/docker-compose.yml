services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - netflix-network

  eureka:
    build: ./eureka
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka
    networks:
      - netflix-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webshop"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netflix-network

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    depends_on:
      - eureka
    networks:
      - netflix-network

  admin:
    build: ./admin/admin
    ports:
      - "8084:8082"
    environment:
      SECURITY_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password}
      SECURITY_JWT_SECRET: ${ADMIN_JWT_SECRET:-dev-only-admin-secret-change-before-deploy-1234567890}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webshop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1"
      APP_IMAGE_STORAGE_DIR: /app/image
    volumes:
      - product_images:/app/image
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - netflix-network

  auth-service:
    build: ./auth-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SERVER_PORT: 8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webshop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-development-secret}

    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - netflix-network

  shop:
    build: ./shop/shop
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/webshop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "1"
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-development-secret}
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge

volumes:
  postgres_data:
  product_images:
