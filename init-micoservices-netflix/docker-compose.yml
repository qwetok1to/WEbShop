x-postgres-credentials: &postgres-credentials
  POSTGRES_DB: ${POSTGRES_DB:-webshop}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1}

x-spring-datasource: &spring-datasource
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-1}

x-jwt-secret: &jwt-secret
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-development-secret}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - netflix-network

  eureka:
    build: ./eureka
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka
    networks:
      - netflix-network

  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-credentials
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webshop}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - netflix-network

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      <<: *jwt-secret
    depends_on:
      - eureka
    networks:
      - netflix-network



  auth-service:
    build: ./auth-service
    ports:
      - "8083:8083"
    environment:
      SPRING_APPLICATION_NAME: auth-service
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SERVER_PORT: 8083
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-webshop}
      <<: [*spring-datasource, *jwt-secret]
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - netflix-network

  shop:
    build: ./shop/shop
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-webshop}
      <<: [*spring-datasource, *jwt-secret]
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    networks:
      - netflix-network

  admin:
    build: ./admin
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-webshop}
      <<: [*spring-datasource, *jwt-secret]
      PRODUCT_UPLOAD_DIR: /app/uploads/products
    volumes:
      - ./admin/uploads/products:/app/uploads/products
    depends_on:
      eureka:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - netflix-network

networks:
  netflix-network:
    driver: bridge

volumes:
  postgres_data:
